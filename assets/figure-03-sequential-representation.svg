<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:24px;font-weight:700}.b{font-size:20px;fill:#475467}</style><text x="70" y="85" class="t">Sequential Time-Series Representation</text><text x="70" y="125" class="s">Preserve daily ordering instead of collapsing behavior into a single weekly mean</text><text x="70" y="205" class="h">Conventional aggregation</text><rect x="70" y="235" width="430" height="105" rx="18" fill="#f8fafc" stroke="#d0d5dd"/><text x="100" y="280" class="b">Day 1 · Day 2 · … · Day 7</text><text x="100" y="315" class="b">→ one weekly average feature vector</text><text x="70" y="425" class="h">Current representation</text><g fill="#eff6ff" stroke="#60a5fa"><rect x="70" y="455" width="125" height="90" rx="14"/><rect x="225" y="455" width="125" height="90" rx="14"/><rect x="380" y="455" width="125" height="90" rx="14"/><rect x="535" y="455" width="125" height="90" rx="14"/><rect x="690" y="455" width="125" height="90" rx="14"/></g><text x="103" y="510" class="b">Day 1</text><text x="258" y="510" class="b">Day 2</text><text x="413" y="510" class="b">Day 3</text><text x="568" y="510" class="b">…</text><text x="723" y="510" class="b">Day T</text><path d="M195 500h30M350 500h30M505 500h30M660 500h30" stroke="#2563eb" stroke-width="5"/><rect x="880" y="260" width="250" height="250" rx="26" fill="#f5f3ff" stroke="#a78bfa"/><text x="915" y="315" class="h">Model target</text><text x="915" y="365" class="b">Within-person</text><text x="915" y="402" class="b">behavioral change</text><text x="915" y="455" class="b">→ later PHQ-9</text><text x="915" y="492" class="b">change</text><path d="M815 500h65" stroke="#2563eb" stroke-width="6"/><path d="M868 487l20 13-20 13" fill="#2563eb"/></svg>